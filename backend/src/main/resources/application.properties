# 本地开发用的密钥文件，位于 backend/.env（被 .gitignore 忽略，绝不进仓库）。
# optional: 前缀意味着文件不存在时照常启动——CI 和生产都不该有这个文件，它们从
# 真实环境变量注入。**环境变量的优先级高于本文件**，所以命令行临时覆盖依然有效。
# 模板见 backend/.env.example。
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:3001}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/app}
spring.datasource.username=${DATABASE_USERNAME:app}
spring.datasource.password=${DATABASE_PASSWORD:app}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

app.storage.endpoint=${STORAGE_ENDPOINT:http://127.0.0.1:9000}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.bucket=${STORAGE_BUCKET:app}
app.storage.access-key-id=${STORAGE_ACCESS_KEY_ID:app}
app.storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:app-rustfs-secret}

# 文件上传大小限制（tech/knowledge-base/architecture.md §7）。
# max-swallow-size 容易漏：超限被拒绝后 Tomcat 默认仍会读完并丢弃整个请求体，好让
# 连接可以复用；设小之后它会直接断开连接，不再为一个已经确定要拒绝的 50MB 请求白
# 白消耗带宽和时间。
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:60MB}
server.tomcat.max-swallow-size=${UPLOAD_MAX_SWALLOW_SIZE:2MB}

# 上传并发上限。长耗时操作要限的是并发数而不是 QPS：上传持续几十秒，"每秒 N 个请求"
# 意味着稳态并发量是 N×耗时秒数。许可在 Filter 里获取（不能在 HandlerInterceptor，
# multipart 请求体由 DispatcherServlet 解析，那个时机在 Filter 之后）。
app.upload.max-concurrent=${UPLOAD_MAX_CONCURRENT:3}
# 拿不到许可时的等待上限。带超时而不是无限期排队：排队的请求同样占着一个容器线程，
# 无限等只会把线程池也拖垮，而且用户那边是一个永远不返回的请求。
app.upload.acquire-timeout=${UPLOAD_ACQUIRE_TIMEOUT:5s}

# Embedding 供应商（火山方舟 Ark，OpenAI 兼容的 /embeddings 协议）。
# api-key 默认留空：未配置时注入一个抛明确异常的实现，应用照常启动——沿用
# FlywayConfig / ensureStorageBucket 已建立的"依赖不可用不阻塞启动"模式。
# 真实 Key 只从部署环境注入，绝不写进本文件或任何 env 示例文件。
#
# base-url 用 /api/plan/v3 而不是常见的 /api/v3：这是 Coding Plan 专用端点，
# 实测 Plan 类 Key 打到 /api/v3 会直接 401。不要"顺手改回标准路径"。
#
# !! 合规风险，务必先读（2026-07-28 查证）：方舟官方文档写明「Coding Plan API Key
# 仅能在官方支持的 AI 编程工具中使用，不能用于直接 API 调用。违规使用会被系统判定
# 为滥用，导致订阅停用或账号封禁。」支持的工具指 Claude Code / Cursor / Cline /
# Codex CLI 等。**本项目拿它做知识库向量化，正属于被禁止的"直接 API 调用"。**
# 这是项目所有者知情后的选择，不是推荐用法；换成标准计费 Key + 一个支持标准
# /embeddings 接口的文本 embedding 模型才是合规路径（届时 base-url 改回 /api/v3）。
# 详见 deploy/README.md「Embedding API Key」与 tech/knowledge-base/architecture.md §6。
#
# dimensions 必须与 V2 migration 里的 vector(1024) 一致，启动时校验，不一致直接失败。
# 注意 doubao-embedding-vision 的**原生输出是 2048 维**，1024 是通过请求里的
# dimensions 参数降维得到的——客户端始终显式发送该参数，去掉它会拿到 2048 维向量、
# 每次写库都在运行时报错。
app.embedding.base-url=${EMBEDDING_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v3}
app.embedding.api-key=${EMBEDDING_API_KEY:}
app.embedding.model=${EMBEDDING_MODEL:doubao-embedding-vision}
app.embedding.dimensions=${EMBEDDING_DIMENSIONS:1024}
# 单次请求的文本条数。10 是 Ark 的硬上限，实测得到：传 32 条直接被拒，
# 报 "Embeddings API input limit exceeded: max 10, got 32"。
# 换供应商时必须重新核实：超限的症状是"大文档第一批就整体失败、小文档完全正常"，
# 很容易误判成偶发问题。
app.embedding.batch-size=${EMBEDDING_BATCH_SIZE:10}
# 出站限流防护。**这不是保险措施，是必需的**：实测一份 700 分块的文档串行发出约 70 次
# 请求，8.4 秒后就撞上 429 AccountRateLimitExceeded，整个入库任务失败，用户重试也没用
# （重试同样一次性打完）。200ms 间隔把速率压到约 5 次/秒——实测被限时约 8.3 次/秒。
# 两个手段分工不同：间隔从源头降低触发概率，退避处理仍然撞上的情况；只做后者的话
# 大文档会每批都撞一次再退避一次，总耗时反而更长。
app.embedding.batch-interval=${EMBEDDING_BATCH_INTERVAL:200ms}
app.embedding.max-retries=${EMBEDDING_MAX_RETRIES:3}
app.embedding.retry-base-delay=${EMBEDDING_RETRY_BASE_DELAY:1s}

# 入库调度。设为 false 可整个关掉派发器与启动回收——**多个进程/上下文连同一个库时，
# 每个都会去抢任务，各自的启动回收还会把别人正在跑的任务判成僵尸**（ADR 0002 的单实例
# 假设）。测试里 ApplicationTests 就是靠它关掉调度器的。
app.knowledge.ingestion.enabled=${KNOWLEDGE_INGESTION_ENABLED:true}
app.knowledge.ingestion.poll-interval=${KNOWLEDGE_INGESTION_POLL_INTERVAL:2s}
# 卡死回收的第二层：心跳停更超过 heartbeat-timeout 的 RUNNING 任务判为卡死。
# 启动回收只覆盖"进程重启"，任务在进程还活着时卡死（执行线程挂在没有超时的网络调用上）
# 它管不着，没有这一层那份文档会永久停在 RUNNING——CAS 抢不到、删除更新也被 409 挡住。
# 与启动回收不同，这一层**不依赖单实例假设**：判据是任务自己的心跳停了。
app.knowledge.ingestion.heartbeat-timeout=${KNOWLEDGE_INGESTION_HEARTBEAT_TIMEOUT:5m}
app.knowledge.ingestion.recovery-interval=${KNOWLEDGE_INGESTION_RECOVERY_INTERVAL:60s}

# 定时同步。min-interval 限制 syncCron 解析出的相邻两次执行间隔，防的是用户配出
# "* * * * * ?" 这种每秒执行、把按次计费的 Embedding 费用打穿的表达式。
app.knowledge.sync.enabled=${KNOWLEDGE_SYNC_ENABLED:true}
app.knowledge.sync.scan-interval=${KNOWLEDGE_SYNC_SCAN_INTERVAL:60s}
app.knowledge.sync.min-interval=${KNOWLEDGE_SYNC_MIN_INTERVAL:10m}
