services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RustFS: 课程技术栈使用的对象存储（MinIO 因收紧开源协议被课程替换为 RustFS）。
  # 镜像仍处于 alpha 阶段，官方文档确认的已知问题：CreateBucket 偶发 503（见
  # learning/ragent-column/02-bootstrap-and-deployment/02-02-Docker本地中间件部署.md）。
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.72
    command: ["/data"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: app
      RUSTFS_SECRET_KEY: app-rustfs-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  rustfs_data:
