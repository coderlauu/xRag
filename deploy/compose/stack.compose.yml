services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RustFS：课程技术栈同款对象存储，MinIO 收紧开源协议后的替代方案（仍处 alpha 阶段）。
  # 官方镜像未确认 MINIO_SERVER_URL/MINIO_BROWSER_REDIRECT_URL 的等价配置项，真正上线前
  # 需要核实 RustFS 是否需要单独的"公网 URL"配置才能正确生成外链/重定向。
  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.72
    command: ["/data"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    expose:
      - "9000"
      - "9001"
    volumes:
      - rustfs_data:/data

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      PORT: 3001
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-app}
      STORAGE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      STORAGE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/api/v1/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"

  pgweb:
    image: sosedoff/pgweb:0.16.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PGWEB_AUTH_USER: ""
      PGWEB_AUTH_PASS: ""
    command:
      [
        "--bind=0.0.0.0",
        "--listen=8081",
        "--url=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      ]
    expose:
      - "8081"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      pgweb:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.example.com}
      STORAGE_PUBLIC_HOST: ${STORAGE_PUBLIC_HOST:-storage.app.example.com}
      CONSOLE_PUBLIC_HOST: ${CONSOLE_PUBLIC_HOST:-console.app.example.com}
      DB_CONSOLE_PUBLIC_HOST: ${DB_CONSOLE_PUBLIC_HOST:-db.app.example.com}
      DB_CONSOLE_BASICAUTH_USERNAME: ${DB_CONSOLE_BASICAUTH_USERNAME:-admin}
      DB_CONSOLE_BASICAUTH_PASSWORD_HASH: ${DB_CONSOLE_BASICAUTH_PASSWORD_HASH:-$$2y$$10$$mQhXgmqA0c/66a0ixsA9iOL02USstip1ffXy./tzGDp7TJfknHnua}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${CADDYFILE_PATH}:/etc/caddy/Caddyfile:ro

volumes:
  postgres_data:
  rustfs_data:
  caddy_data:
  caddy_config:
