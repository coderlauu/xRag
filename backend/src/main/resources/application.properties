server.port=${PORT:3001}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/app}
spring.datasource.username=${DATABASE_USERNAME:app}
spring.datasource.password=${DATABASE_PASSWORD:app}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}

app.storage.endpoint=${STORAGE_ENDPOINT:http://127.0.0.1:9000}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.bucket=${STORAGE_BUCKET:app}
app.storage.access-key-id=${STORAGE_ACCESS_KEY_ID:app}
app.storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:app-rustfs-secret}
