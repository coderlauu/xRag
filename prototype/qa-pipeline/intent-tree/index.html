<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>意图树管理页 · Phase 3A 原型</title>
  <!-- Three variants of the intent-tree manager, switchable via ?variant=, on a throwaway prototype route. -->
  <style>
    :root{
      --bg:#f5f7f7;--surface:#fff;--surface-2:#f8faf9;--surface-3:#edf3f1;--ink:#132321;--ink-2:#50625f;--ink-3:#82908e;
      --line:#dde6e3;--line-2:#c7d4d0;--accent:#0d7a72;--accent-2:#075d58;--accent-soft:#e4f3f0;
      --ok:#247451;--ok-bg:#e7f5ed;--warn:#9c5c09;--warn-bg:#fff3da;--bad:#b4232a;--bad-bg:#fdebed;
      --blue:#2b63a3;--blue-bg:#eaf1fa;--shadow:0 18px 48px rgba(16,43,39,.14);
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"SFMono-Regular",Consolas,monospace;
    }
    *{box-sizing:border-box}html{min-width:320px}body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.52 var(--sans);padding-bottom:70px;-webkit-font-smoothing:antialiased}#app{padding-top:52px}
    button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.muted{color:var(--ink-3)}.subtle{color:var(--ink-2)}.mono{font-family:var(--mono)}.hidden{display:none!important}
    .app-header{height:58px;padding:0 26px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}.brand{font-size:19px;font-weight:750;letter-spacing:-.03em}.main-nav{display:flex;gap:5px}.main-nav a{color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:7px;font-size:13.5px}.main-nav a.active{color:var(--accent);background:var(--accent-soft);font-weight:650}.proto-mark{margin-left:auto;border:1px solid #d7b85d;color:#725307;background:#fff9e5;padding:3px 9px;border-radius:999px;font:650 10px/1.5 var(--mono);letter-spacing:.06em}
    .btn{border:1px solid var(--line-2);background:var(--surface);padding:7px 11px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px}.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-2)}.btn.danger{color:var(--bad);border-color:#e8b9bd;background:#fff}.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}.btn.small{padding:5px 8px;font-size:11.5px}.btn:disabled{opacity:.46;cursor:not-allowed}.icon-btn{width:34px;height:34px;padding:0}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.blue{background:var(--blue-bg);color:var(--blue)}
    .page-head{padding:20px 24px 14px;display:flex;align-items:flex-start;gap:16px}.page-head h1{font-size:24px;line-height:1.2;letter-spacing:-.03em;margin:0 0 5px}.page-head p{margin:0;color:var(--ink-2);font-size:13px}.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.search{width:280px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px}.sync-line{margin:0 24px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-2)}.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.sync-line .right{margin-left:auto;color:var(--ink-3)}
    .scenario-dock{position:fixed;left:18px;right:18px;top:66px;z-index:80;background:#112824;color:#dce8e5;border:1px solid #284a44;border-radius:11px;padding:8px 10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 14px 40px rgba(5,27,23,.18)}.scenario-dock .label{font:700 10px var(--mono);letter-spacing:.08em;color:#80a29b;margin:0 3px}.scenario-dock button{border:1px solid #31544e;color:#a9bbb7;background:#17332e;border-radius:6px;padding:5px 8px;font-size:11.5px}.scenario-dock button.active{color:#c6fff4;background:#146359;border-color:#3e9c8e}.scenario-dock .hint{margin-left:auto;color:#789991;font-size:11px}.switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:90;background:#0c1f1b;color:#fff;border:1px solid #3f5b55;border-radius:999px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 36px rgba(0,0,0,.28)}.switcher button{width:34px;height:30px;border:0;border-radius:999px;background:#183a33;color:#cce1dc;font-size:17px}.switcher button:hover{background:#23574d}.variant-label{min-width:210px;text-align:center;font-size:12px}.variant-label b{color:#8be0d0}.toast{position:fixed;top:118px;right:22px;z-index:100;background:#153b34;color:#fff;padding:10px 13px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    /* tree */
    .tree-list{padding:8px}.tree-row{width:100%;border:0;background:transparent;border-radius:8px;min-height:40px;display:grid;grid-template-columns:22px minmax(120px,1fr) auto;align-items:center;gap:6px;padding:6px 8px;text-align:left;color:var(--ink-2)}.tree-row:hover{background:var(--surface-3)}.tree-row.selected{background:var(--accent-soft);color:var(--ink)}.tree-row .caret{color:var(--ink-3);text-align:center}.tree-row .node-main{min-width:0}.tree-row .node-name{display:block;font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree-row .node-meta{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree-row.depth-1{padding-left:25px}.tree-row.depth-2{padding-left:46px}.tree-row.off .node-name{text-decoration:line-through;color:var(--ink-3)}.row-tags{display:flex;gap:4px;align-items:center}
    .inspector{background:var(--surface);min-width:0}.inspector-top{padding:14px 16px;border-bottom:1px solid var(--line)}.path{font-size:11px;color:var(--ink-3);margin-bottom:5px}.inspector-top h2{font-size:18px;margin:0 0 8px;letter-spacing:-.02em}.tabs{display:flex;gap:5px;margin-top:10px}.tabs button{border:0;background:transparent;padding:5px 7px;border-radius:6px;color:var(--ink-2);font-size:11.5px}.tabs button.active{background:var(--accent-soft);color:var(--accent);font-weight:700}.form-scroll{padding:16px;display:grid;gap:15px}.field{display:grid;gap:6px}.field label{font-size:11.5px;font-weight:700;color:var(--ink-2)}.field-help{font-size:10.5px;color:var(--ink-3)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:8px 9px}.field textarea{min-height:88px;resize:vertical}.examples-list{display:grid;gap:6px}.example-line{display:grid;grid-template-columns:1fr 30px;gap:6px}.example-line button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px}.callout{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;font-size:11.5px;color:var(--ink-2)}.callout.warn{border-color:#e9ce91;background:var(--warn-bg);color:#79520f}.callout.bad{border-color:#e8b9bd;background:var(--bad-bg);color:#86232a}.form-actions{position:sticky;bottom:0;border-top:1px solid var(--line);background:rgba(255,255,255,.96);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end}.danger-zone{border-top:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}.danger-zone .description{margin-right:auto;font-size:11px;color:var(--ink-3)}
    /* A */
    .layout-a{margin:0 24px 28px;height:calc(100vh - 172px);min-height:590px;display:grid;grid-template-columns:minmax(350px,42%) minmax(420px,58%);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 8px 32px rgba(16,43,39,.06)}.a-tree{border-right:1px solid var(--line);overflow:auto;background:#fafcfb}.tree-toolbar{padding:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}.tree-toolbar .count{font-size:11px;color:var(--ink-3);margin-left:auto}.a-inspector{overflow:auto}
    /* B */
    .layout-b{margin:0 24px 30px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.outline-head,.outline-row{display:grid;grid-template-columns:minmax(260px,1.2fr) 90px 110px minmax(160px,.8fr) minmax(210px,1fr) 110px;align-items:center;gap:8px;padding:10px 13px}.outline-head{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}.outline-row{border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}.outline-row:hover{background:var(--surface-2)}.outline-row.selected{background:var(--accent-soft)}.outline-name{display:flex;align-items:center;gap:7px;min-width:0}.branch-mark{font:12px var(--mono);color:var(--ink-3)}.desc-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}.outline-drawer{position:fixed;inset:58px 0 0 auto;width:min(540px,100%);background:var(--surface);z-index:60;border-left:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}.drawer-close{float:right}.scrim{position:fixed;inset:58px 0 0;background:rgba(10,28,24,.22);z-index:55}
    /* C */
    .layout-c{margin:0 24px 30px;height:calc(100vh - 172px);min-height:590px;display:grid;grid-template-columns:minmax(540px,1fr) 380px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.canvas{position:relative;overflow:auto;background-color:#f8fbfa;background-image:radial-gradient(#d4dfdc 1px,transparent 1px);background-size:20px 20px}.canvas-inner{min-width:820px;min-height:560px;position:relative}.edge{position:absolute;height:2px;background:#bacbc7;transform-origin:left center;z-index:1}.node{position:absolute;width:170px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px;box-shadow:0 6px 18px rgba(16,43,39,.08);z-index:2;cursor:pointer}.node:hover,.node.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 8px 22px rgba(16,43,39,.1)}.node.off{opacity:.55}.node b{display:block;font-size:12px;margin-bottom:4px}.node small{color:var(--ink-3);display:block}.canvas-tools{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:6px}.c-inspector{border-left:1px solid var(--line);overflow:auto}
    /* modal */
    .modal-layer{position:fixed;inset:0;z-index:110;background:rgba(10,28,24,.36);display:grid;place-items:center;padding:18px}.modal{width:min(520px,100%);background:var(--surface);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.26);overflow:hidden}.modal-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal-head h2{font-size:16px;margin:0}.modal-head button{margin-left:auto}.modal-body{padding:16px 17px}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}.impact div{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px;text-align:center}.impact b{display:block;font:750 19px var(--mono)}.impact span{font-size:10.5px;color:var(--ink-3)}.modal-actions{padding:11px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:980px){.page-head{padding:16px}.sync-line{margin:0 16px 10px}.layout-a,.layout-c{margin:0 16px;grid-template-columns:40% 60%}.layout-b{margin:0 16px}.outline-head,.outline-row{grid-template-columns:minmax(230px,1fr) 80px 100px minmax(160px,1fr)}.outline-head>*:nth-child(5),.outline-head>*:nth-child(6),.outline-row>*:nth-child(5),.outline-row>*:nth-child(6){display:none}.layout-c{grid-template-columns:1fr 340px}.scenario-dock .hint{display:none}}
    @media(max-width:720px){body{padding-bottom:68px}#app{padding-top:86px}.app-header{padding:0 14px;gap:12px}.main-nav a:not(.active){display:none}.proto-mark{font-size:9px}.page-head{display:block;padding:13px}.page-head h1{font-size:20px}.head-actions{margin:10px 0 0}.search{width:100%}.sync-line{margin:0 12px 8px}.sync-line .right{display:none}.layout-a,.layout-c{display:block;margin:0 12px;height:auto;min-height:0}.a-tree,.canvas{height:510px;border:0}.a-inspector,.c-inspector{display:none}.layout-b{margin:0 12px}.outline-head{display:none}.outline-row{grid-template-columns:1fr auto;padding:11px}.outline-row>*:not(:first-child):not(:nth-child(3)){display:none}.scenario-dock{left:8px;right:8px;top:62px;bottom:auto;max-height:78px;overflow:auto}.switcher{bottom:12px}.variant-label{min-width:164px}.impact{grid-template-columns:1fr}.node{width:155px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="app-header"><span class="brand">xrag</span><nav class="main-nav" aria-label="主导航"><a href="#">问答</a><a href="#">知识库</a><a class="active" href="#">意图树</a><a href="#">诊断</a></nav><span class="proto-mark">PROTOTYPE · 3A</span></header>
  <main id="app"></main>
  <div class="scenario-dock" id="scenarioDock" aria-label="原型场景控制"></div>
  <div class="switcher" aria-label="原型方案切换"><button id="prevVariant" aria-label="上一个方案">←</button><div class="variant-label" id="variantLabel"></div><button id="nextVariant" aria-label="下一个方案">→</button></div>
  <div class="toast" id="toast" role="status"></div>
  <div id="modalRoot"></div>
  <script>
    const variants={A:"Tree + Inspector",B:"Operational Outline",C:"Route Canvas"};
    const scenarios={normal:"正常编辑",disable:"停用子树",enable:"启用受阻",remove:"删除子树",conflict:"版本冲突",search:"搜索同名"};
    let variant=new URLSearchParams(location.search).get("variant")||"C";if(!variants[variant])variant="C";
    let scenario="normal",selected="overseas",drawerOpen=false;
    const nodes=[
      {id:"commerce",name:"商品服务",depth:0,role:"组织",enabled:true,children:5,desc:"商品购买后的规则与服务"},
      {id:"digital",name:"3C 数码",depth:1,role:"组织",enabled:true,children:1,desc:"手机、电脑、数码配件相关服务"},
      {id:"digital-return",name:"退货政策",depth:2,role:"KB",enabled:true,kb:"3C 售后政策",desc:"手机、电脑、数码配件的退货条件、材料与期限"},
      {id:"appliance",name:"家电",depth:1,role:"组织",enabled:true,children:1,desc:"大型和小型家电售后"},
      {id:"appliance-return",name:"退换货规则",depth:2,role:"KB",enabled:true,kb:"家电售后手册",desc:"家电产品退换、安装后退货与上门处理规则"},
      {id:"logistics",name:"物流与配送",depth:0,role:"组织",enabled:true,children:4,desc:"配送、仓储、清关与运费"},
      {id:"crossborder",name:"跨境物流",depth:1,role:"组织",enabled:true,children:3,desc:"跨境仓储、清关和国际段运输"},
      {id:"overseas",name:"海外仓",depth:2,role:"KB",enabled:true,kb:"跨境物流知识库",desc:"海外仓入库、出库、库存、时效与异常处理",snippet:"回答时区分入库和出库时效。"},
      {id:"customs",name:"清关流程",depth:2,role:"KB",enabled:true,kb:"跨境物流知识库",desc:"跨境货物申报、资料、查验与放行流程"},
      {id:"freight",name:"运费",depth:2,role:"KB",enabled:false,kb:"跨境物流知识库",desc:"跨境运费计算、计费重与附加费"},
      {id:"social",name:"通用交互",depth:0,role:"组织",enabled:true,children:1,desc:"不需要知识检索的通用交互"},
      {id:"greeting",name:"问候",depth:1,role:"SYSTEM",enabled:true,desc:"用户打招呼、告别或询问系统能力"}
    ];
    function current(){return nodes.find(n=>n.id===selected)||nodes[7]}
    function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"})[c])}
    function pathFor(n){const map={commerce:"商品服务",digital:"商品服务 › 3C 数码","digital-return":"商品服务 › 3C 数码 › 退货政策",appliance:"商品服务 › 家电","appliance-return":"商品服务 › 家电 › 退换货规则",logistics:"物流与配送",crossborder:"物流与配送 › 跨境物流",overseas:"物流与配送 › 跨境物流 › 海外仓",customs:"物流与配送 › 跨境物流 › 清关流程",freight:"物流与配送 › 跨境物流 › 运费",social:"通用交互",greeting:"通用交互 › 问候"};return map[n.id]||n.name}
    function showToast(text){const el=document.getElementById("toast");el.textContent=text;el.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove("show"),1900)}
    function updateVariant(next){variant=next;drawerOpen=false;const p=new URLSearchParams(location.search);p.set("variant",variant);history.replaceState(null,"",`?${p}`);render()}
    function cycle(d){const k=Object.keys(variants),i=k.indexOf(variant);updateVariant(k[(i+d+k.length)%k.length])}
    function header(){return `<div class="page-head"><div><h1>意图树</h1><p>只有启用的叶子参与问题匹配；匹配描述会直接影响路由准确率。</p></div><div class="head-actions"><input class="search" id="searchInput" aria-label="搜索意图" placeholder="搜索名称、路径、描述或知识库" value="${scenario==="search"?"退货":""}"><button class="btn primary" data-action="add-root">＋ 新增根节点</button></div></div><div class="sync-line"><span class="sync-dot"></span><b>${scenario==="conflict"?"检测到较新的配置":"当前显示最新配置"}</b><span>${scenario==="conflict"?"你的编辑仍保留，保存前请比较。":"12 个节点 · 7 个可匹配叶子"}</span><span class="right">刚刚刷新 · <button class="btn ghost small" data-action="refresh">刷新</button></span></div>`}
    function roleTag(n){return `<span class="tag ${n.role==="KB"?"blue":n.role==="SYSTEM"?"warn":""}">${n.role}</span>`}
    function stateTag(n){return n.enabled?`<span class="tag ok">已启用</span>`:`<span class="tag">已停用</span>`}
    function visibleNodes(){if(scenario!=="search")return nodes;return nodes.filter(n=>n.name.includes("退货")||n.name.includes("退换货")||["commerce","digital","appliance"].includes(n.id))}
    function tree(){return `<div class="tree-toolbar"><button class="btn small" data-action="expand">全部展开</button><button class="btn small" data-action="filter">配置不完整</button><span class="count">12 节点</span></div><div class="tree-list" role="tree">${visibleNodes().map(n=>`<button role="treeitem" aria-level="${n.depth+1}" class="tree-row depth-${n.depth} ${selected===n.id?"selected":""} ${!n.enabled?"off":""}" data-node="${n.id}"><span class="caret">${n.children?"⌄":"·"}</span><span class="node-main"><span class="node-name">${esc(n.name)}</span><span class="node-meta">${n.kb?esc(n.kb):n.children?n.children+" 个后代":"系统场景"}</span></span><span class="row-tags">${roleTag(n)}${!n.enabled?`<span class="tag">停用</span>`:""}</span></button>`).join("")}</div>`}
    function form(){const n=current();const isLeaf=n.role!=="组织";const conflict=scenario==="conflict";const blocked=scenario==="enable";return `<div class="inspector"><div class="inspector-top"><div class="path">${pathFor(n)}</div><h2>${esc(n.name)}</h2><div style="display:flex;gap:6px">${roleTag(n)}${stateTag(n)}${conflict?`<span class="tag bad">版本冲突</span>`:""}</div><div class="tabs"><button class="active">配置</button><button>影响范围</button></div></div><div class="form-scroll">${conflict?`<div class="callout bad"><b>该节点已被其他操作更新。</b><br>本地输入仍保留；刷新比较后再保存，不会自动覆盖。</div>`:""}${blocked?`<div class="callout warn"><b>不能启用整个子树。</b><br>“运费”缺少有效匹配示例；请先补齐，系统不会跳过它后显示整体成功。</div>`:""}<div class="field"><label>名称</label><input id="nameField" value="${esc(n.name)}"><span class="field-help">同一父节点下不能重名。</span></div><div class="field"><label>父节点</label><input value="${esc(n.depth?pathFor(n).split(" › ").slice(0,-1).join(" › "):"— 根节点")}" disabled><span class="field-help">3A 不支持拖拽或直接换父节点。</span></div>${isLeaf?`<div class="field"><label>匹配描述</label><textarea id="descField">${esc(conflict?n.desc+"（本地补充：也覆盖延误赔付）":n.desc)}</textarea><span class="field-help">写清什么问题应该来这里，以及它和兄弟节点的区别。知识库简介不会自动代替此字段。</span></div><div class="field"><label>正向示例</label><div class="examples-list"><div class="example-line"><input value="海外仓入库超时怎么办？"><button aria-label="删除示例">×</button></div><div class="example-line"><input value="海外仓多久能完成上架？"><button aria-label="删除示例">×</button></div></div><button class="btn small" data-action="add-example">＋ 添加示例</button></div>`:`<div class="callout">组织节点不参与匹配。它用于组织叶子和表达业务域。</div>`}${n.role==="KB"?`<div class="field"><label>绑定知识库</label><select><option>${esc(n.kb||"请选择知识库")}</option><option>跨境物流知识库</option><option>3C 售后政策</option></select><span class="field-help mono">kb_01J7…A93 · 已启用 · 428 个分块</span></div>`:""}${n.role==="SYSTEM"?`<div class="field"><label>系统场景</label><select><option>GREETING</option></select></div>`:""}${isLeaf?`<div class="field"><label>回答附加规则（后续生成阶段使用）</label><textarea>${esc(n.snippet||"")}</textarea><span class="field-help">只会追加到系统规则，不能替换安全规则；3A 保存但尚不执行。</span></div>`:""}</div><div class="form-actions"><button class="btn" data-action="cancel">取消修改</button><button class="btn primary" data-action="save">保存节点</button></div><div class="danger-zone"><span class="description">启停与删除独立确认，普通保存不会触发级联。</span><button class="btn" data-action="toggle">${n.enabled?"停用":"启用"}</button><button class="btn danger" data-action="delete">删除</button></div></div>`}
    function renderA(){return `${header()}<section class="layout-a"><aside class="a-tree">${tree()}</aside><div class="a-inspector">${form()}</div></section>${drawerOpen?`<div class="scrim" data-action="close"></div><aside class="outline-drawer"><button class="btn icon-btn drawer-close" data-action="close">×</button>${form()}</aside>`:""}`}
    function outline(){return `<div class="outline-head"><span>节点 / 路径</span><span>角色</span><span>状态</span><span>绑定</span><span>匹配描述</span><span>更新时间</span></div>${visibleNodes().map(n=>`<div class="outline-row ${selected===n.id?"selected":""}" data-node="${n.id}"><div class="outline-name"><span class="branch-mark">${"·  ".repeat(n.depth)}${n.children?"▾":"└"}</span><b>${esc(n.name)}</b></div><div>${roleTag(n)}</div><div>${stateTag(n)}</div><div class="desc-cell">${esc(n.kb||"—")}</div><div class="desc-cell">${esc(n.desc)}</div><div class="muted mono">刚刚</div></div>`).join("")}`}
    function renderB(){return `${header()}<section class="layout-b">${outline()}</section>${drawerOpen?`<div class="scrim" data-action="close"></div><aside class="outline-drawer"><button class="btn icon-btn drawer-close" data-action="close">×</button>${form()}</aside>`:""}`}
    function canvas(){const positions={commerce:[50,90],digital:[280,40],"digital-return":[550,25],appliance:[280,175],"appliance-return":[550,175],logistics:[50,330],crossborder:[280,320],overseas:[550,265],customs:[550,375],freight:[550,485],social:[50,500],greeting:[280,500]};return `<div class="canvas-tools"><button class="btn small">适应画布</button><button class="btn small">全部展开</button></div><div class="canvas-inner">${visibleNodes().map(n=>{const p=positions[n.id]||[50,50];return `<button class="node ${selected===n.id?"selected":""} ${!n.enabled?"off":""}" style="left:${p[0]}px;top:${p[1]}px" data-node="${n.id}"><b>${esc(n.name)}</b><small>${n.role}${n.kb?" · "+esc(n.kb):""}</small></button>`}).join("")}</div>`}
    function renderC(){return `${header()}<section class="layout-c"><div class="canvas">${canvas()}</div><aside class="c-inspector">${form()}</aside></section>${drawerOpen?`<div class="scrim" data-action="close"></div><aside class="outline-drawer"><button class="btn icon-btn drawer-close" data-action="close">×</button>${form()}</aside>`:""}`}
    function modal(kind){const n=current();const parent=n.children||n.role==="组织";const isDelete=kind==="delete";const blocked=kind==="enable"&&scenario==="enable";let title=isDelete?`删除「${n.name}」${parent?"及其子树":""}？`:n.enabled?`停用「${n.name}」${parent?"及其子树":""}？`:`启用「${n.name}」？`;let body=blocked?`<div class="callout bad"><b>操作被阻止。</b><br>“运费”缺少有效匹配示例。请先补齐，不会跳过后代后显示整体成功。</div>`:`<p>${isDelete?"删除采用逻辑删除，当前页面不提供恢复。":"已有对话与历史记录不会被删除；新问题将读取新的配置快照。"}</p>${parent?`<div class="impact"><div><b>${n.id==="crossborder"?4:6}</b><span>受影响节点</span></div><div><b>${n.id==="crossborder"?2:3}</b><span>启用叶子</span></div><div><b>${n.id==="crossborder"?1:2}</b><span>绑定知识库</span></div></div>`:""}`;return `<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="btn icon-btn" data-action="close-modal">×</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button class="btn" data-action="close-modal">取消</button>${!blocked?`<button class="btn ${isDelete?"danger":"primary"}" data-action="confirm">${isDelete?"删除整个子树":n.enabled?"停用整个子树":"启用整个已配置子树"}</button>`:""}</div></section></div>`}
    function renderDock(){document.getElementById("scenarioDock").innerHTML=`<span class="label">SCENARIO</span>${Object.entries(scenarios).map(([k,v])=>`<button class="${scenario===k?"active":""}" data-scenario="${k}">${v}</button>`).join("")}<span class="hint">场景控制不是产品界面</span>`}
    function bind(){document.querySelectorAll("[data-node]").forEach(el=>el.onclick=()=>{selected=el.dataset.node;drawerOpen=variant==="B"||innerWidth<=720;render()});document.querySelectorAll("[data-scenario]").forEach(el=>el.onclick=()=>{scenario=el.dataset.scenario;if(scenario==="disable"||scenario==="remove"||scenario==="enable")selected="crossborder";else if(scenario==="search")selected="digital-return";else selected="overseas";drawerOpen=variant==="B";render();if(scenario==="disable")openModal("toggle");if(scenario==="remove")openModal("delete");if(scenario==="enable")openModal("enable")});document.querySelectorAll("[data-action]").forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==="close"){drawerOpen=false;render()}else if(a==="save"){if(scenario==="conflict"){showToast("保存未执行：请先处理版本冲突")}else showToast("节点已保存（原型内存状态）")}else if(a==="toggle")openModal(current().enabled?"toggle":"enable");else if(a==="delete")openModal("delete");else if(a==="add-root")showToast("新根节点默认停用，保存后进入详情完善");else if(a==="add-example")showToast("已添加一个空示例行");else if(a==="cancel")showToast("已放弃本地修改");else if(a==="refresh")showToast("已刷新配置快照");else if(a==="close-modal")closeModal();else if(a==="confirm"){closeModal();showToast("级联操作已整体完成（原型）")}});const input=document.getElementById("searchInput");if(input)input.oninput=e=>{if(e.target.value.includes("退货")){scenario="search";render()}}}
    function openModal(kind){document.getElementById("modalRoot").innerHTML=modal(kind);document.querySelectorAll("#modalRoot [data-action]").forEach(el=>el.onclick=()=>{if(el.dataset.action==="close-modal")closeModal();if(el.dataset.action==="confirm"){closeModal();showToast("级联操作已整体完成（原型）")}})}
    function closeModal(){document.getElementById("modalRoot").innerHTML=""}
    function render(){document.getElementById("app").innerHTML=variant==="A"?renderA():variant==="B"?renderB():renderC();document.getElementById("variantLabel").innerHTML=`<b>${variant}</b> — ${variants[variant]}`;renderDock();bind()}
    document.getElementById("prevVariant").onclick=()=>cycle(-1);document.getElementById("nextVariant").onclick=()=>cycle(1);document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea,select,[contenteditable]"))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);if(e.key==="Escape"){closeModal();drawerOpen=false;render()}});render();
  </script>
</body>
</html>
