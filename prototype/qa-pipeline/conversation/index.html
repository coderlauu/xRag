<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>问答对话页 · Phase 3A 基线 + 3B/3C 增量原型</title>
  <!-- Three variants of the Phase 3A conversation page, switchable via ?variant=, on a throwaway prototype route.
       3B (sources + tools, ui-spec §13) and 3C (generation + streaming + stop + queue, ui-spec §15)
       only extend the selected variant C. -->
  <style>
    :root {
      --bg:#f5f7f7; --surface:#fff; --surface-2:#f8faf9; --surface-3:#edf3f1;
      --ink:#132321; --ink-2:#50625f; --ink-3:#82908e; --line:#dde6e3; --line-2:#c7d4d0;
      --accent:#0d7a72; --accent-2:#075d58; --accent-soft:#e4f3f0;
      --ok:#247451; --ok-bg:#e7f5ed; --warn:#9c5c09; --warn-bg:#fff3da;
      --bad:#b4232a; --bad-bg:#fdebed; --blue:#2b63a3; --blue-bg:#eaf1fa;
      --shadow:0 18px 48px rgba(16,43,39,.12);
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box} html{min-width:320px} body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--sans);padding-bottom:70px;-webkit-font-smoothing:antialiased}#app{padding-top:88px}
    button,input,textarea{font:inherit;color:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .muted{color:var(--ink-3)} .subtle{color:var(--ink-2)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.hidden{display:none!important}
    .app-header{height:58px;padding:0 26px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95);position:sticky;top:0;z-index:30;backdrop-filter:blur(14px)}
    .brand{font-size:19px;font-weight:750;letter-spacing:-.03em}.main-nav{display:flex;gap:5px}.main-nav a{color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:7px;font-size:13.5px}.main-nav a.active{color:var(--accent);background:var(--accent-soft);font-weight:650}
    .proto-mark{margin-left:auto;border:1px solid #d7b85d;color:#725307;background:#fff9e5;padding:3px 9px;border-radius:999px;font:650 10px/1.5 var(--mono);letter-spacing:.06em}
    .btn{border:1px solid var(--line-2);background:var(--surface);padding:7px 11px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px}.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.primary:hover{background:var(--accent-2)}.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}.btn.small{padding:5px 8px;font-size:11.5px}.btn:disabled{cursor:not-allowed;opacity:.48}
    .icon-btn{width:34px;height:34px;padding:0}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:650;background:var(--surface-3);color:var(--ink-2)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.blue{background:var(--blue-bg);color:var(--blue)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
    .scenario-dock{position:fixed;left:18px;right:18px;top:66px;z-index:60;background:#112824;color:#dce8e5;border:1px solid #284a44;border-radius:11px;padding:8px 10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;box-shadow:0 14px 40px rgba(5,27,23,.18)}
    .scenario-dock .label{font:700 10px var(--mono);letter-spacing:.08em;color:#80a29b;margin:0 3px}.scenario-dock button{border:1px solid #31544e;color:#a9bbb7;background:#17332e;border-radius:6px;padding:5px 8px;font-size:11.5px}.scenario-dock button.active{color:#c6fff4;background:#146359;border-color:#3e9c8e}.scenario-dock .hint{margin-left:auto;color:#789991;font-size:11px}
    .switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;background:#0c1f1b;color:#fff;border:1px solid #3f5b55;border-radius:999px;padding:7px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 36px rgba(0,0,0,.28)}.switcher button{width:34px;height:30px;border:0;border-radius:999px;background:#183a33;color:#cce1dc;font-size:17px}.switcher button:hover{background:#23574d}.variant-label{min-width:220px;text-align:center;font-size:12px}.variant-label b{color:#8be0d0}
    .toast{position:fixed;top:72px;right:22px;z-index:80;background:#153b34;color:white;padding:10px 13px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    .empty-welcome{text-align:center;padding:72px 24px;max-width:620px;margin:auto}.empty-welcome .spark{width:48px;height:48px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px;font-size:24px}.empty-welcome h1{font-size:25px;margin:0 0 8px;letter-spacing:-.03em}.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:24px;text-align:left}.example{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;color:var(--ink-2);cursor:pointer}.example:hover{border-color:var(--accent);color:var(--ink)}
    .message{display:flex;gap:10px;margin:18px 0;max-width:820px}.message.user{margin-left:auto;flex-direction:row-reverse}.avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:750}.message.user .avatar{background:#203834;color:#d9ece8}.bubble{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:11px 13px;min-width:90px}.message.user .bubble{background:#153f38;color:#edf8f5;border-color:#153f38}.bubble p{margin:0}.message-meta{margin-top:5px;font:10.5px var(--mono);color:var(--ink-3)}.message.user .message-meta{color:#a8c1bc}
    .guidance{margin-top:11px;display:grid;gap:7px}.guidance button{text-align:left;border:1px solid var(--line-2);background:var(--surface-2);padding:9px 10px;border-radius:8px;color:var(--ink-2)}.guidance button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
    .acceptance-note{margin:14px auto;border:1px dashed #9dbaaf;background:#f2faf7;border-radius:9px;padding:10px 12px;color:#37615a;font-size:12px;max-width:760px}.acceptance-note b{color:var(--accent)}
    .composer{border:1px solid var(--line-2);background:var(--surface);border-radius:13px;padding:10px;box-shadow:0 8px 28px rgba(15,50,44,.07)}.composer textarea{width:100%;min-height:58px;max-height:140px;resize:vertical;border:0;background:transparent;outline:0;padding:2px 4px}.composer-foot{display:flex;align-items:center;gap:9px;margin-top:7px}.composer-foot .hint{color:var(--ink-3);font-size:11px}.composer-foot .btn{margin-left:auto}
    .steps{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.step{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}.step:after{content:"›";color:var(--line-2);margin-left:2px}.step:last-child:after{display:none}.step-dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:9px;font-weight:750}.step.done{color:var(--ok)}.step.done .step-dot{background:var(--ok-bg)}.step.active{color:var(--accent);font-weight:700}.step.active .step-dot{background:var(--accent-soft)}.step.warn{color:var(--warn)}.step.warn .step-dot{background:var(--warn-bg)}
    .inspector-section{padding:14px 15px;border-bottom:1px solid var(--line)}.inspector-section:last-child{border-bottom:0}.inspector-section h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}.question-box{padding:9px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;margin-top:7px;font-size:12.5px}.intent-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.intent-row:last-child{border:0}.score{font:700 11px var(--mono);padding-top:2px;color:var(--accent)}.intent-path{font-size:12.5px}.intent-reason{font-size:11px;color:var(--ink-3);margin-top:2px}.degrade{padding:8px 9px;border-radius:7px;background:var(--warn-bg);color:#78500f;font-size:11.5px}
    /* A — three-pane conversation */
    .layout-a{height:calc(100vh - 58px);min-height:620px;display:grid;grid-template-columns:270px minmax(480px,1fr) 340px;overflow:hidden}.layout-a.no-inspector{grid-template-columns:270px minmax(480px,1fr)}.layout-a.no-inspector .a-inspector{display:none}.a-sidebar{border-right:1px solid var(--line);background:#f9fbfa;padding:14px 10px;overflow:auto}.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 5px 10px}.side-title{font-size:12px;font-weight:750;color:var(--ink-2)}.conversation-list{display:grid;gap:4px}.conversation-item{width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px;color:var(--ink-2)}.conversation-item:hover{background:var(--surface-3)}.conversation-item.active{background:var(--accent-soft);color:var(--ink)}.conversation-item b{display:block;font-size:12.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-item span{display:block;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-item .pending{color:var(--warn)}
    .a-main{min-width:0;background:var(--surface);display:flex;flex-direction:column}.chat-head{height:58px;border-bottom:1px solid var(--line);padding:0 18px;display:flex;align-items:center;gap:10px}.chat-head h1{font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-head .actions{margin-left:auto;display:flex;gap:6px}.chat-scroll{flex:1;overflow:auto;padding:22px max(22px,calc((100% - 780px)/2))}.a-composer{padding:12px max(22px,calc((100% - 780px)/2)) 18px;border-top:1px solid var(--line)}.a-inspector{border-left:1px solid var(--line);background:#fbfcfc;overflow:auto}.inspector-head{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:8px}.inspector-head b{font-size:13px}.inspector-head .tag{margin-left:auto}
    /* B — pipeline workbench */
    .layout-b{min-height:calc(100vh - 58px);padding:20px 24px 34px;max-width:1480px;margin:auto}.b-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.b-head h1{font-size:23px;margin:0 0 4px}.b-pipeline{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:14px;box-shadow:0 8px 28px rgba(16,43,39,.05)}.b-pipeline .steps{justify-content:space-between}.b-grid{display:grid;grid-template-columns:220px minmax(0,1.2fr) minmax(360px,.8fr);gap:14px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel-title{padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px;font-weight:750;display:flex;align-items:center;gap:8px}.panel-body{padding:13px}.b-conversations .conversation-item{border-radius:7px}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare-card{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:11px}.compare-card h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 7px}.b-chat{margin-top:14px}.b-chat .panel-body{max-height:300px;overflow:auto}.b-composer{margin-top:10px}
    /* C — focused chat */
    .layout-c{min-height:calc(100vh - 58px);display:flex;flex-direction:column}.c-toolbar{height:54px;padding:0 22px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--surface)}.c-toolbar h1{font-size:14px;margin:0 auto}.c-focus{width:min(780px,calc(100% - 32px));margin:0 auto;flex:1;display:flex;flex-direction:column}.c-scroll{flex:1;padding:36px 0 22px}.c-composer{position:sticky;bottom:0;padding:12px 0 22px;background:linear-gradient(transparent,var(--bg) 22%)}.drawer{position:fixed;inset:58px 0 0 auto;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;overflow:auto}.drawer .drawer-head{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px}.drawer .drawer-head button{margin-left:auto}.scrim{position:fixed;inset:58px 0 0;background:rgba(10,28,24,.22);z-index:45}.conversation-drawer{left:0;right:auto;border-left:0;border-right:1px solid var(--line);width:min(330px,92%);padding:14px 10px}
    /* C 是已选方案，两侧都是抽屉；把抽屉压到场景控制条下面，否则抽屉头上的关闭按钮点不到。
       这是原型脚手架造成的几何问题，不是产品规则。 */
    :root{--chrome-top:146px} /* 58px 页头 + #app 为场景控制条让出的 88px */
    .drawer,.scrim{top:var(--chrome-top)}
    /* C 的输入区是 sticky 的：主区必须自己滚，否则整页滚动会把输入区推走、也会盖住工具卡的按钮。 */
    .layout-c{height:calc(100vh - var(--chrome-top));min-height:520px}
    .layout-c .c-focus{min-height:0}
    .layout-c .c-scroll{overflow:auto;min-height:0}
    .toast{top:calc(var(--chrome-top) + 10px)} /* 别盖住场景控制条上的说明文字 */
    /* 3C — 生成、流式、停止、排队（ui-spec §15） */
    .gen-state{align-self:center;max-width:640px;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:2px 0}
    .gen-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:genpulse 1.1s ease-in-out infinite}
    @keyframes genpulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.gen-dot{animation:none;opacity:.8}.caret{animation:none}}
    /* 答案按纯文本渲染：保留换行，不解析 Markdown、不产生可点击目标（PRD §13.9）。 */
    .answer{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.72}
    .caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:text-bottom;background:var(--accent);animation:blink .95s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .answer-mark{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2)}
    .chip{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px;white-space:nowrap}
    .chip.warn{border-color:#b8801f;color:#8a5e12}.chip.danger{border-color:var(--bad);color:var(--bad)}
    .answer-acts{align-self:center;max-width:640px;display:flex;gap:8px;flex-wrap:wrap}
    .answer-acts .btn[disabled]{opacity:.45;cursor:not-allowed}

    /* 3B — 来源、工具、非阻塞提示（ui-spec §13） */
    .inspector-group{border-bottom:2px solid var(--line-2)}.inspector-group:last-child{border-bottom:0}
    .group-head{display:flex;align-items:center;gap:8px;padding:13px 15px 0}.group-head b{font-size:12.5px}.group-head .tag{margin-left:auto}
    .sec-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px}.sec-head h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}.sec-head .count{font:11px var(--mono);color:var(--ink-3)}
    .state{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:650;border:1px solid transparent}
    .state .glyph{font:700 10px var(--mono)}
    .state.neutral{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-2)}
    .state.ok{background:var(--ok-bg);color:var(--ok);border-color:#b7dfc9}
    .state.warn{background:var(--warn-bg);color:var(--warn);border-color:#e8cf95}
    .state.bad{background:var(--bad-bg);color:var(--bad);border-color:#eeb9bd}
    .state.busy{background:var(--blue-bg);color:var(--blue);border-color:#b9cfe9}
    .state-note{font-size:11px;color:var(--ink-2);margin:6px 0 0}
    .src-list{display:grid;gap:8px}
    .src{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 10px}
    .src-kb{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.02em}
    .src-doc{font-size:12.5px;margin:2px 0 1px;overflow-wrap:anywhere}
    .src-doc.gone{color:var(--ink-3);text-decoration:line-through}
    .src-pos{font:11px var(--mono);color:var(--ink-3)}
    .src-foot{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
    .src details summary{font-size:11.5px;color:var(--ink-2);cursor:pointer;list-style:none}.src details summary::-webkit-details-marker{display:none}.src details summary:before{content:"▸ ";color:var(--ink-3)}.src details[open] summary:before{content:"▾ "}
    .src-quote{margin-top:6px;padding:8px 9px;background:var(--surface-2);border-left:3px solid var(--line-2);border-radius:0 6px 6px 0;font-size:11.5px;color:var(--ink-2)}
    .src-link{font-size:11.5px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline}.src-link:disabled{color:var(--ink-3);text-decoration:none;cursor:not-allowed}
    .fail-list{display:grid;gap:6px;margin-top:10px;border-top:1px dashed var(--line-2);padding-top:10px}
    .fail-item{display:flex;align-items:center;gap:8px;font-size:11.5px}.fail-item b{font-weight:650}.fail-item .why{color:var(--ink-3);margin-left:auto;font-size:11px}
    .inspector-empty{border:1px dashed var(--line-2);border-radius:8px;padding:12px;color:var(--ink-3);font-size:11.5px;text-align:center}
    .tool-item{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 10px}
    .tool-item .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tool-item .name{font-size:12.5px;font-weight:650}.tool-item .ms{margin-left:auto;font:10.5px var(--mono);color:var(--ink-3)}
    .tool-item details{margin-top:7px}.tool-item summary{font-size:11.5px;color:var(--ink-2);cursor:pointer}
    .banner{display:flex;gap:9px;align-items:flex-start;border:1px solid #e6cf9a;background:var(--warn-bg);border-radius:10px;padding:10px 12px;margin:14px auto;max-width:820px;font-size:12.5px;color:#6f4a08}
    .banner .glyph{font:700 12px var(--mono);line-height:1.4}.banner .acts{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
    .source-strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px auto 16px;max-width:820px;padding-left:38px}
    .source-strip .open{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:11.5px;color:var(--ink-2)}.source-strip .open:hover{border-color:var(--accent);color:var(--accent)}
    .next-steps{margin:9px 0 0;padding-left:18px;display:grid;gap:3px;font-size:12.5px;color:var(--ink-2)}
    .compare-note{margin:12px auto;max-width:760px;border:1px dashed var(--line-2);border-radius:9px;padding:9px 11px;font-size:11.5px;color:var(--ink-3);background:var(--surface-2)}.compare-note b{color:var(--ink-2)}
    .tool-card{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px 13px;margin-top:11px;box-shadow:0 6px 20px rgba(15,50,44,.06)}
    .tool-card.danger{border-color:#e3b3b6;background:#fffbfb}
    .tool-card .tc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tool-card .tc-head b{font-size:13px}
    .tool-card .tc-what{margin:7px 0 0;font-size:12.5px;color:var(--ink-2)}
    .tool-card .tc-src{margin:9px 0 5px;font:10.5px var(--mono);color:var(--ink-3);letter-spacing:.02em}
    .params{width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .params th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--surface-2);padding:6px 9px;font-weight:650}
    .params td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
    .params td.k{width:38%;color:var(--ink-2)}.params td.v{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
    .params tr.bad-row{background:var(--bad-bg)}.params tr.bad-row td.v{color:var(--bad)}
    .req{font-size:10px;color:var(--bad);margin-left:4px}
    .allowed{font-size:11px;color:var(--ink-3);margin-top:5px}
    .tc-actions{display:flex;gap:9px;margin-top:12px;align-items:center}.tc-actions .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;margin-left:auto}.tc-actions .btn.danger:hover{background:#9a1c23}
    .tc-result{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:9px 10px}
    .tc-result pre{margin:6px 0 0;font:11.5px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
    .plain-note{font-size:10.5px;color:var(--ink-3);margin-top:6px}
    .scenario-dock{flex-direction:column;align-items:stretch;gap:6px}
    .dock-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.dock-row button{white-space:nowrap;flex:none}.dock-row .tier,.dock-row .hint{flex:none}
    .dock-row .tier{font:700 10px var(--mono);letter-spacing:.06em;color:#cfe9e2;background:#1d4740;border:1px solid #31544e;border-radius:5px;padding:3px 7px}
    @media(max-width:1100px){.layout-a{grid-template-columns:240px minmax(0,1fr)}.a-inspector{display:none}.layout-b{padding:16px}.b-grid{grid-template-columns:190px 1fr}.b-grid>.panel:last-child{grid-column:1/-1}.scenario-dock .hint{display:none}}
    @media(max-width:720px){body{padding-bottom:68px}#app{padding-top:120px}:root{--chrome-top:178px}.dock-row{flex-wrap:nowrap;overflow-x:auto}.source-strip{padding-left:0}.tc-actions{flex-direction:column;align-items:stretch;gap:12px}.tc-actions .btn{margin-left:0;width:100%}.params td.k{width:auto}.params,.params tbody,.params tr,.params td{display:block;width:100%}.params thead{display:none}.params tr{border-top:1px solid var(--line)}.params tr:first-child{border-top:0}.params td{border-top:0;padding:6px 9px}.params td.k{padding-bottom:0;font-size:11px;color:var(--ink-3)}.app-header{padding:0 14px;gap:12px}.main-nav a:not(.active){display:none}.proto-mark{font-size:9px}.layout-a{display:block;height:auto;min-height:calc(100vh - 58px)}.a-sidebar{display:none}.a-main{min-height:calc(100vh - 58px)}.chat-scroll{padding:16px}.a-composer{padding:10px 12px 82px}.chat-head{padding:0 12px}.layout-b{padding:12px}.b-head{display:block}.b-grid{display:block}.b-grid>.panel{margin-bottom:10px}.b-conversations{display:none}.compare-grid{grid-template-columns:1fr}.b-pipeline .steps{justify-content:flex-start}.c-toolbar{padding:0 12px}.c-focus{width:calc(100% - 24px)}.c-scroll{padding-top:18px}.c-composer{padding-bottom:82px}.examples{grid-template-columns:1fr}.scenario-dock{left:8px;right:8px;top:62px;bottom:auto;max-height:104px;overflow:auto}.switcher{bottom:12px}.variant-label{min-width:168px}.message{max-width:95%}}

</head>
<body>
  <header class="app-header">
    <span class="brand">xrag</span>
    <nav class="main-nav" aria-label="主导航">
      <a class="active" href="#">问答</a><a href="#">知识库</a><a href="#">意图树</a><a href="#">诊断</a>
    </nav>
    <span class="proto-mark">PROTOTYPE · 3A + 3B + 3C DRAFT</span>
  </header>
  <main id="app"></main>
  <div class="scenario-dock" id="scenarioDock" aria-label="原型场景控制"></div>
  <div class="switcher" aria-label="原型方案切换">
    <button id="prevVariant" aria-label="上一个方案">←</button>
    <div class="variant-label" id="variantLabel"></div>
    <button id="nextVariant" aria-label="下一个方案">→</button>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const variants = {
      A: "Conversation + Inspector",
      B: "Pipeline Workbench",
      C: "Focused Chat（已选择）"
    };
    /** 3B 增量只在已选定的方案上演示；A/B 只是 3A 的决策留档（ui-spec §13.11）。 */
    const SELECTED = "C";
    const scenarios3A = {
      empty: "新对话",
      followup: "追问改写",
      compound: "复合问题",
      ambiguous: "歧义引导",
      fallback: "改写降级",
      overflow: "问题超限"
    };
    // 3B 增量场景（ui-spec §13.11）。产品语义冻结在 PRD §12，这里只演示界面表达。
    const scenarios3B = {
      sources: "来源展示",
      norerank: "未精排",
      partial: "部分库失败",
      noresult: "无结果",
      toolConfirm: "工具确认",
      toolCancel: "工具取消",
      toolFailed: "工具失败",
      toolUnavailable: "工具不可用",
      toolAbort: "参数抽取中止"
    };
    // 3C 增量场景（ui-spec §15.9）。产品语义冻结在 PRD §13，这里只演示界面表达。
    const scenarios3C = {
      genQueue: "排队→生成→完成",
      genStopped: "生成中停止",
      queueCancel: "排队中取消",
      genUnsaved: "完成但未保存",
      genFailed: "生成中失败",
      genRejected: "等待超时被拒",
      genReconnect: "断连重连"
    };
    const scenarios = { ...scenarios3A, ...scenarios3B, ...scenarios3C };
    const is3B = key => key in scenarios3B;
    const is3C = key => key in scenarios3C;
    let variant = new URLSearchParams(location.search).get("variant") || SELECTED;
    if (!variants[variant]) variant = SELECTED;
    let scenario = "followup";
    let inspectorOpen = variant === "A" && innerWidth > 1100;
    let leftOpen = false;
    /** 工具状态覆盖值；null 表示用当前场景的默认状态。切换场景时清空。 */
    let toolState = null;

    const conversations = [
      ["海外仓入库时效", "那超时了怎么办？", "刚刚"],
      ["退货政策", "等待你确认具体品类", "12 分钟", "pending"],
      ["退款材料与到账时间", "问题已拆成 2 个方向", "昨天"],
      ["发票开具规则", "已形成检索动作", "周二"]
    ];

    // ——— 3B 演示数据 ———
    // 来源只有三项对外字段：知识库 / 文档 / 片段位置。没有分数、没有名次、没有命中通道（ui-spec §13.3）。
    const SOURCES = [
      ["售后服务知识库", "退货与退款操作手册 v3.docx", "#12", "签收后 7 日内可发起退货；生鲜、定制类商品除外。发起后系统生成退货单号，用户需在 5 个工作日内寄回。"],
      ["售后服务知识库", "退货与退款操作手册 v3.docx", "#13", "退货商品需保持吊牌完整、包装未拆封；已拆封仅在存在质量问题时受理。"],
      ["财务结算知识库", "退款到账时效说明.md", "#4", "原路退回：微信/支付宝 1~3 个工作日，银行卡 3~7 个工作日，信用卡以发卡行账单周期为准。"],
      ["商品服务知识库", "3C 数码品类特殊约定.pdf", "#31", "3C 数码类商品激活后不支持无理由退货，仅支持质量问题的换修流程。"],
      ["售后服务知识库", "（源文档已删除）", "#7", "本条来源对应的源文档已被逻辑删除，正文仍在本轮上下文中使用过。"]
    ].map(([kb, doc, pos, text]) => ({ kb, doc, pos, text, gone: doc.startsWith("（") }));

    const TOOL = {
      name: "提交退货工单",
      // 这句话来自白名单配置，不是模型生成的——否则确认就成了走过场（ui-spec §13.7.2）。
      what: "在售后工单系统中新建一张退货工单，并把工单号回写到本次对话。",
      sideEffect: true,
      params: [
        { k: "订单号", v: "ORD-20260806-1183", required: true },
        { k: "退货原因", v: "商品与描述不符", required: true },
        { k: "联系电话", v: "138****4521", required: false }
      ],
      badParams: [
        { k: "订单号", v: "未能从对话中确定", required: true, bad: "缺少必填参数" },
        { k: "退货原因", v: "无理由", required: true, bad: "不在允许值内" },
        { k: "联系电话", v: "138****4521", required: false }
      ],
      allowed: "商品与描述不符 / 质量问题 / 物流破损 / 尺码不合适",
      result: "工单号：RT-20260808-0417\n状态：待客服受理\n预计响应：4 小时内"
    };

    /**
     * 3C 演示数据。答案按**纯文本**渲染（PRD §13.9：模型输出同样是不可信内容），
     * 所以这里全程走 esc()，不解析 Markdown、不产生可点击目标。
     */
    const ANSWER_FULL = "签收后 7 日内可以发起退货，生鲜和定制类商品除外。\n\n需要准备：订单号、商品外观照片、以及包装吊牌完整的凭证。退款按原路退回，银行卡通常 3 到 5 个工作日到账。";
    const ANSWER_PARTIAL = "签收后 7 日内可以发起退货，生鲜和定制类商品除外。\n\n需要准备：订单号、商品外";

    /**
     * 3C 的界面态。**没有"停止中"**——点下停止直接进已停止（PRD §13.2），
     * 给用户一个"正在停止"的中间态只会让他怀疑停止没生效。
     */
    function state3C() {
      const s0 = { phase: "done", answer: ANSWER_FULL, stopped: false, unsaved: false,
                   failed: null, rejected: false, reconnect: false, queued: false };
      switch (scenario) {
        case "genQueue":     return { ...s0, phase: gen3CStep, queued: true };
        case "genStopped":   return { ...s0, phase: "stopped", answer: ANSWER_PARTIAL, stopped: true };
        case "queueCancel":  return { ...s0, phase: gen3CStep === "queue" ? "queue" : "stopped",
                                      answer: "", stopped: gen3CStep !== "queue", queued: true };
        case "genUnsaved":   return { ...s0, unsaved: true };
        case "genFailed":    return { ...s0, phase: "failed", answer: ANSWER_PARTIAL,
                                      failed: "模型服务暂时不可用" };
        case "genRejected":  return { ...s0, phase: "rejected", answer: "", rejected: true };
        case "genReconnect": return { ...s0, phase: "reconnect", answer: "" };
        default:             return s0;
      }
    }
    /** genQueue / queueCancel 用它演示"排队 → 生成 → 完成"三步，点状态行推进。 */
    let gen3CStep = "queue";

    // 场景 → 3B 数据。partial 的失败判断来自显式状态，不是"条数少"（ui-spec §13.6）。
    function data3B() {
      const base = { sources: [], reranked: true, failed: [], tool: null, hitCount: 0, dedup: 0 };
      if (!is3B(scenario)) return base;
      switch (scenario) {
        case "sources": return { ...base, sources: SOURCES.slice(0, 5), hitCount: 26, dedup: 19 };
        case "norerank": return { ...base, sources: SOURCES.slice(0, 3), reranked: false, hitCount: 21, dedup: 16 };
        case "partial": return { ...base, sources: SOURCES.slice(0, 2), hitCount: 11, dedup: 9,
          failed: [["海外仓运营手册", "检索超时"], ["历史归档知识库", "知识库暂不可用"]] };
        case "noresult": return { ...base, hitCount: 0, dedup: 0 };
        default: return { ...base, sources: SOURCES.slice(0, 2), hitCount: 9, dedup: 7, tool: toolStatus() };
      }
    }
    function toolStatus() {
      if (toolState) return toolState;
      return { toolConfirm: "PENDING", toolCancel: "CANCELLED", toolFailed: "FAILED",
        toolUnavailable: "UNAVAILABLE", toolAbort: "ABORTED" }[scenario] || null;
    }
    const TOOL_STATE = {
      PENDING: ["warn", "?", "待确认"], RUNNING: ["busy", "~", "执行中"], SUCCEEDED: ["ok", "✓", "已完成"],
      FAILED: ["bad", "✕", "失败"], CANCELLED: ["neutral", "—", "已取消"],
      UNAVAILABLE: ["bad", "!", "不可用"], ABORTED: ["warn", "!", "已中止"]
    };
    /** 状态标签：图标形状 + 文字，去掉颜色也能区分（ui-spec §13.10）。 */
    function state(kind, glyph, text) {
      return `<span class="state ${kind}"><span class="glyph" aria-hidden="true">${glyph}</span>${esc(text)}</span>`;
    }
    function toolStateTag(code) {
      const [kind, glyph, text] = TOOL_STATE[code]; return state(kind, glyph, text);
    }
    function sourceMarks(d) {
      return (d.reranked ? "" : state("warn", "≈", "未精排")) + (d.failed.length ? state("bad", "!", "结果不完整") : "");
    }
    function paramTable(rows, allowed) {
      return `<table class="params"><thead><tr><th>参数（由模型从对话中抽取）</th><th>值</th></tr></thead><tbody>${rows.map(p => `
        <tr class="${p.bad ? "bad-row" : ""}"><td class="k">${esc(p.k)}${p.required ? '<span class="req">必填</span>' : ""}</td><td class="v">${esc(p.v)}${p.bad ? ` — ${esc(p.bad)}` : ""}</td></tr>`).join("")}</tbody></table>${
        allowed ? `<p class="allowed">「退货原因」允许值：${esc(allowed)}</p>` : ""}`;
    }
    /** 消息区的工具卡。只有有副作用的工具才出现按钮，且确认卡不抢焦点（ui-spec §13.7.2）。 */
    function toolCard(code) {
      const abort = code === "ABORTED";
      const rows = abort ? TOOL.badParams : TOOL.params;
      const head = `<div class="tc-head"><b>${abort ? "无法执行：" : code === "PENDING" ? "需要你确认：" : ""}${esc(TOOL.name)}</b>${state("bad", "!", "有副作用")}${toolStateTag(code)}</div>`;
      let body = `<p class="tc-what">${esc(TOOL.what)}</p><p class="tc-src">参数由模型从对话中抽取，执行前请核对</p>${paramTable(rows, abort ? TOOL.allowed : null)}`;
      let foot = "";
      if (code === "PENDING") {
        foot = `<div class="tc-actions"><button class="btn" data-tool="cancel">取消</button><button class="btn danger" data-tool="confirm">确认执行</button></div>
          <p class="plain-note">Tab 先到「取消」；卡片出现时不抢焦点，Esc 不等于取消。参数不可就地编辑，要改请取消后重说。</p>`;
      } else if (code === "RUNNING") {
        foot = `<div class="tc-actions"><span class="subtle">执行中…（3B 无中止能力，不摆一个点了没用的按钮）</span></div>`;
      } else if (code === "SUCCEEDED") {
        foot = `<div class="tc-result"><b style="font-size:12px">工具返回</b><pre>${esc(TOOL.result)}</pre><p class="plain-note">工具返回按纯文本渲染：不解析 HTML、不渲染链接与图片。</p></div>`;
      } else if (code === "FAILED") {
        foot = `<div class="tc-actions"><span class="subtle">执行超时</span><button class="btn" data-tool="retry">重试</button></div>
          <p class="plain-note">只展示归一化文案，绝不透传异常 message（可能带内部主机名与堆栈片段）。</p>`;
      } else if (code === "CANCELLED") {
        foot = `<p class="plain-note">你取消了这次执行，工单没有被创建。可以补充信息后重新提出。</p>`;
      } else if (code === "ABORTED") {
        body = `<p class="tc-what">我还需要「订单号」才能提交这张工单；另外「退货原因」只能填 ${esc(TOOL.allowed)}，“无理由”不在范围内。请补充后再说一次。</p>${paramTable(rows, TOOL.allowed)}`;
        foot = `<p class="plain-note">参数抽取失败一律中止，禁止用默认值继续执行（PRD §12.7）。</p>`;
      }
      return `<div class="tool-card danger" role="status">${head}${body}${foot}</div>`;
    }
    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"})[c]);
    }
    function showToast(text) {
      const el = document.getElementById("toast"); el.textContent = text; el.classList.add("show");
      clearTimeout(showToast.timer); showToast.timer = setTimeout(() => el.classList.remove("show"), 1800);
    }
    function updateVariant(next) {
      variant = next; inspectorOpen = variant === "A" && innerWidth > 1100; leftOpen = false;
      const params = new URLSearchParams(location.search); params.set("variant", variant);
      history.replaceState(null, "", `?${params}`); render();
    }
    function cycle(delta) {
      const keys = Object.keys(variants); const i = keys.indexOf(variant); updateVariant(keys[(i + delta + keys.length) % keys.length]);
    }
    function conversationList() {
      return `<div class="side-head"><span class="side-title">最近对话</span><button class="btn small primary" data-action="new">＋ 新对话</button></div>
        <div class="conversation-list">${conversations.map((c,i)=>`<button class="conversation-item ${i===0&&scenario!=="empty"?"active":""}" data-action="select-conversation"><b>${c[0]}</b><span class="${c[3]||""}">${c[1]}</span><span>${c[2]}</span></button>`).join("")}</div>`;
    }
    function steps() {
      const ambiguous = scenario === "ambiguous";
      const overflow = scenario === "overflow";
      const fallback = scenario === "fallback";
      let items = [
        ["保存", "done"], ["历史", "done"], ["改写", overflow?"warn":"done"],
        ["意图", overflow?"":"done"], ["澄清", ambiguous?"warn":"done"], ["动作", ambiguous||overflow?"":"active"]
      ];
      if (is3B(scenario)) {
        const d = data3B();
        const toolStep = { PENDING:"active", RUNNING:"active", SUCCEEDED:"done", FAILED:"warn",
          UNAVAILABLE:"warn", CANCELLED:"warn", ABORTED:"warn" }[toolStatus()] || "";
        items = [["保存","done"], ["历史","done"], ["改写","done"], ["意图","done"], ["动作","done"],
          ["检索", d.failed.length ? "warn" : "done"],
          // 没有候选就没有精排可做，别把"没执行"画成"已完成"。
          ["精排", !d.sources.length ? "" : d.reranked ? "done" : "warn"], ["工具", toolStep]];
      }
      return `<div class="steps">${items.map((x,i)=>`<span class="step ${x[1]}"><span class="step-dot">${x[1]==="done"?"✓":i+1}</span>${x[0]}</span>`).join("")}</div>`;
    }
    function userMessage(text) { return `<div class="message user"><div class="avatar">你</div><div class="bubble"><p>${esc(text)}</p><div class="message-meta">10:42 · 已保存</div></div></div>`; }
    function assistantMessage(inner, meta) { return `<div class="message"><div class="avatar">AI</div><div class="bubble">${inner}<div class="message-meta">xrag · ${esc(meta || "方向引导")}</div></div></div>`; }
    function sourceStrip(d) {
      if (!d.sources.length) return "";
      return `<div class="source-strip"><button class="open" data-action="open-sources">依据 ${d.sources.length} 条来源 ›</button>${sourceMarks(d)}</div>`;
    }
    /** 3B 消息区。右栏可以是收起的，所以无结果／部分失败／工具确认都必须落在这里（ui-spec §13.1）。 */
    function messages3B() {
      const d = data3B();
      const question = {
        sources: "退货政策和退款到账时间是怎么规定的？",
        norerank: "退货政策和退款到账时间是怎么规定的？",
        partial: "海外仓的退货流程和国内一样吗？",
        noresult: "公司年会的差旅报销标准是多少？"
      }[scenario] || "帮我给订单 ORD-20260806-1183 提交一张退货工单";
      const done = `<div class="acceptance-note"><b>3B 验收</b> · 已完成知识库检索。当前里程碑尚未生成答案，下面是本轮拿到的依据。</div>`;
      if (scenario === "noresult") {
        return userMessage(question)
          + assistantMessage(`<p>没有在你的知识库里找到相关内容。</p><ul class="next-steps"><li>换个说法再问一次</li><li>指定要查的知识库</li><li>确认这份资料是否已经入库</li></ul>`, "检索结果")
          + `<div class="compare-note"><b>对照 3A：</b>方向不明时是另一句——「我还不能确定应该从哪个方向查找，请补充产品或业务范围。」一个是方向不明该改问法，一个是方向明确但库里没有该补资料，两句必须能被区分。</div>`
          + `<div class="acceptance-note"><b>3B 验收</b> · 检索已执行且返回 0 条；不会用模型常识补一段看起来像答案的话。</div>`;
      }
      if (scenario === "partial") {
        return userMessage(question)
          + `<div class="banner"><span class="glyph" aria-hidden="true">!</span><div><b>「海外仓运营手册」「历史归档知识库」本轮没有查成，下面的结果不完整。</b>
             <div class="acts"><button class="btn small primary" data-action="retry-kb">重试失败的知识库</button><button class="btn small" data-action="keep-partial">就现有结果继续</button></div></div></div>`
          + done + sourceStrip(d);
      }
      if (scenario === "toolUnavailable") {
        return userMessage(question) + sourceStrip(d)

        else if(a==="confirm"){
          toolState="RUNNING"; render(); showToast("已确认，正在执行");
          setTimeout(()=>{ if(toolState==="RUNNING"){toolState="SUCCEEDED"; render();} }, 1100);
        } else if(a==="retry"){
          toolState="PENDING"; render();
          showToast("有副作用的工具重试要重新确认，上一次的确认不能复用");
        }
      });
      document.querySelectorAll("[data-guidance]").forEach(el=>el.onclick=()=>{showToast(el.dataset.guidance==="都不是这些"?"已选择：都不是，请补充范围":"已确认方向："+el.dataset.guidance); scenario="followup"; render();});
      document.querySelectorAll("[data-example]").forEach(el=>el.onclick=()=>{scenario="followup"; render(); showToast("示例已发送");});
      document.querySelectorAll("[data-action]").forEach(el=>el.onclick=()=>{
        const a=el.dataset.action;
        if(a==="c3-stop"){
          // 点下停止立即进已停止，没有"停止中"中间态（PRD §13.2）。排队中停止 = 取消排队。
          gen3CStep="done";
          if(scenario==="genQueue") scenario="genStopped";
          else if(scenario==="queueCancel") gen3CStep="stopped";
          render();
          showToast(scenario==="genStopped"?"已停止；已生成的部分保留并标注":"已取消排队；未消耗模型额度");
        }
        else if(a==="c3-retry"){scenario="genQueue";gen3CStep="queue";render();showToast("重新入队")}
        else if(a==="c3-advance"){
          gen3CStep = gen3CStep==="queue" ? "streaming" : "done";
          render();
        }
        else if(a==="open-sources"){inspectorOpen=true;render()}
        else if(a==="open-chunk"){showToast("原型不跳转：定位到具体分块的参数由 Step C 与 api.md 冻结")}
        else if(a==="retry-kb"){scenario="sources";render();showToast("只重跑失败的知识库，不重走改写与意图")}
        else if(a==="keep-partial"){showToast("保留不完整结果继续；界面上的『结果不完整』标记不会消失")}
        else if(a==="new"){scenario="empty";toolState=null;render()} else if(a==="toggle-inspector"){inspectorOpen=!inspectorOpen;render()} else if(a==="open-left"){leftOpen=true;inspectorOpen=false;render()} else if(a==="close-drawers"){leftOpen=false;inspectorOpen=false;render()} else if(a==="send"){const q=document.getElementById("questionInput")?.value.trim(); if(!q){showToast("请输入问题");return} scenario=q.includes("退货")?"ambiguous":"followup";render();showToast("消息已保存并开始理解")} else if(a==="select-conversation"){scenario="followup";toolState=null;leftOpen=false;render()} else if(a==="more"){showToast("对话操作：重命名 / 逻辑删除")}
      });
      const input=document.getElementById("questionInput"); if(input) input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.querySelector('[data-action="send"]')?.click();}};
    }
    function render() {
      document.getElementById("app").innerHTML = variant==="A"?renderA():variant==="B"?renderB():renderC();
      document.getElementById("variantLabel").innerHTML=`<b>${variant}</b> — ${variants[variant]}`; renderDock(); bind();
      // 像真实聊天一样停在最新一条。C 的输入区是 sticky 的，不滚到底时它会盖住工具卡的按钮，
      // 看起来像"这张卡没有操作"。
      const scroller=document.querySelector(".chat-scroll, .c-scroll");
      if(scroller) scroller.scrollTop=scroller.scrollHeight;
    }
    document.getElementById("prevVariant").onclick=()=>cycle(-1); document.getElementById("nextVariant").onclick=()=>cycle(1);
    document.addEventListener("keydown",e=>{const t=e.target;if(t.matches("input,textarea,[contenteditable]"))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);if(e.key==="Escape"&&(leftOpen||inspectorOpen)&&variant==="C"){leftOpen=false;inspectorOpen=false;render();}});
    render();
  </script>
</body>
</html>
